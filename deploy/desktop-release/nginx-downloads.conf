# The desktop app's downloads, served by nginx straight from disk — add
# inside the engroup.ly server block (/www/server/panel/vhost/nginx/
# engroup.ly.conf), above the include of aaPanel's proxy config, so it
# wins over the proxy to the Next.js site. Filled by
# /usr/local/bin/egc-desktop-release (deploy/desktop-release/).
#
# A location with its own add_header doesn't inherit the server's, so
# HSTS is repeated in each one.
location ^~ /downloads/ {
    alias /www/wwwroot/downloads/;
    autoindex off;

    # .live, .lock and in-progress uploads.
    location ~ /\. {
        deny all;
    }

    # Change on every promote: never cached, by browsers or Cloudflare.
    location ~ ^/downloads/desktop/(latest\.json|win32/x64/RELEASES)$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Everything else lives under a versioned path and never changes.
    # Not "always": a 404 for a file that isn't there yet must not be
    # cached for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
}
