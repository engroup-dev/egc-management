name: Promote desktop release (engroup.ly downloads)

# Makes a version stored on the EGC server by build.yml the live one: the
# website's /download page and the Windows auto-update both switch to it.
# Runs when the draft release is published, or by hand with a version —
# which is also how to roll back to an older stored version.
# readme.md, "Releases and downloads".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to make live, e.g. 1.1.18 (an older one rolls back)"
        required: true

concurrency:
  group: desktop-downloads
  cancel-in-progress: false

jobs:
  promote:
    if: vars.DOWNLOADS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${INPUT_VERSION:-${TAG#v}}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: '$V'" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Promote on the server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DOWNLOADS_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DOWNLOADS_SSH_USER }}@${{ secrets.DOWNLOADS_SSH_HOST }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/downloads_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/downloads_key ~/.ssh/known_hosts
          # The key is restricted server-side to egc-desktop-release.
          ssh -i ~/.ssh/downloads_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$SSH_TARGET" "promote $VERSION"

      - name: Smoke test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          base=https://engroup.ly/downloads
          json="$(curl -fsS "$base/desktop/latest.json")"
          echo "$json"
          echo "$json" | grep -q "\"version\": \"$VERSION\"" || { echo "latest.json isn't $VERSION" >&2; exit 1; }
          curl -fsSI "$base/desktop/$VERSION/EGC-Setup-$VERSION.exe" -o /dev/null
          curl -fsSI "$base/desktop/$VERSION/EGC-$VERSION-arm64.dmg" -o /dev/null
          curl -fsS "$base/desktop/win32/x64/RELEASES"
          echo "### Desktop $VERSION is live on https://engroup.ly/download" >> "$GITHUB_STEP_SUMMARY"
