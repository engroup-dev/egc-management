name: Build and Publish (Windows + macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distributables
        run: npm run make
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: List built files
        shell: bash
        run: find out/make -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}
          path: out/make/**

  publish:
    needs: make
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded files
        run: find dist -type f

      # The website's downloads (https://engroup.ly/download): store this
      # build on the EGC server, not yet live. Publishing the draft release
      # below runs promote-desktop.yml, which makes it live. Before the
      # draft exists, so it can't be published ahead of the files.
      # readme.md, "Releases and downloads".
      - name: Upload to engroup.ly downloads (not live yet)
        if: startsWith(github.ref, 'refs/tags/v') && vars.DOWNLOADS_ENABLED == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DOWNLOADS_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DOWNLOADS_SSH_USER }}@${{ secrets.DOWNLOADS_SSH_HOST }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pick() {
            local found
            found="$(find dist -type f -name "$1")"
            [ "$(printf '%s\n' "$found" | grep -c .)" -eq 1 ] || { echo "expected one $1, found: $found" >&2; exit 1; }
            printf '%s' "$found"
          }
          mkdir upload
          cp "$(pick '*Setup.exe')" "upload/EGC-Setup-$VERSION.exe"
          cp "$(pick '*.dmg')" "upload/EGC-$VERSION-arm64.dmg"
          cp "$(pick "*-$VERSION-full.nupkg")" upload/
          cp "$(pick RELEASES)" upload/RELEASES
          ls -l upload

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/downloads_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/downloads_key ~/.ssh/known_hosts
          # The key is restricted server-side to egc-desktop-release.
          (cd upload && tar -czf - -- *) | ssh -i ~/.ssh/downloads_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$SSH_TARGET" "upload $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.nupkg
            dist/**/RELEASES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reminder
        run: |
          echo "### ⚠️ Release is a DRAFT" >> $GITHUB_STEP_SUMMARY
          echo "Auto-update will NOT work until you publish it." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY
